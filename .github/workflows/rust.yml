# # CI runners

name: Cargo artifact inventory
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: amd64/rust@sha256:cc399942461d60f30d20a1e80f1a8f7720bb1590286da6e94626830711570923
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 67ddb91a9fefb1944f7e6e2f2efd595936e34332
    - name: Download existing artifact
      id: download
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        repository: apache/datafusion
        run-id: '34736985556'
        name: cargo-check
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/cargo-check
    - name: Restore existing artifact
      if: steps.download.outcome == 'success'
      run: 'tar -xf "$RUNNER_TEMP/cargo-check/check-workspace.tar"

        tar -xf "$RUNNER_TEMP/cargo-check/check-registry.tar" -C "$CARGO_HOME"'
    - name: Setup Rust toolchain
      if: steps.download.outcome != 'success'
      uses: ./.github/actions/setup-builder
      with:
        rust-version: 1.98.1
    - name: Rust Dependency Cache
      if: steps.download.outcome != 'success'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        shared-key: amd-ci-check
        save-if: 'false'
    - name: Reproduce workspace build if download is unavailable
      if: steps.download.outcome != 'success'
      run: cargo xtask ci step check workspace
    - name: Inventory archive contents
      run: 'du --bytes --max-depth=2 target "$CARGO_HOME/registry" | sort -nr

        find target -type f -printf "%s %p\n" | sort -nr | sed -n "1,30p"

        find "$CARGO_HOME/registry" -type f -printf "%s %p\n" | sort -nr | sed -n "1,20p"

        df -h'
