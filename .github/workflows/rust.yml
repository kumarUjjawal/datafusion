# # CI runners

name: Cargo artifact comparison
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  baseline-producer:
    name: baseline / workspace
    runs-on: ubuntu-24.04
    container:
      image: amd64/rust@sha256:cc399942461d60f30d20a1e80f1a8f7720bb1590286da6e94626830711570923
    steps:
    - uses: runs-on/action@efac073ea2507ec18797de3a81704201ade11d9d
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 67ddb91a9fefb1944f7e6e2f2efd595936e34332
    - name: Setup Rust toolchain
      uses: ./.github/actions/setup-builder
      with:
        rust-version: 1.98.1
    - name: Record comparison environment
      run: |
        git rev-parse HEAD
        rustc -Vv
        cargo -V
        nproc
        lscpu
        sha256sum Cargo.lock
    - name: Rust Dependency Cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        shared-key: amd-ci-check
        save-if: 'false'
    - name: Prepare cargo build
      run: cargo xtask ci step check workspace
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
  artifact-producer:
    name: trimmed artifact / workspace
    runs-on: ubuntu-24.04
    container:
      image: amd64/rust@sha256:cc399942461d60f30d20a1e80f1a8f7720bb1590286da6e94626830711570923
    steps:
    - uses: runs-on/action@efac073ea2507ec18797de3a81704201ade11d9d
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 67ddb91a9fefb1944f7e6e2f2efd595936e34332
    - name: Setup Rust toolchain
      uses: ./.github/actions/setup-builder
      with:
        rust-version: 1.98.1
    - name: Record comparison environment
      run: |
        git rev-parse HEAD
        rustc -Vv
        cargo -V
        nproc
        lscpu
        sha256sum Cargo.lock
    - name: Rust Dependency Cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        shared-key: amd-ci-check
        save-if: 'false'
    - name: Prepare cargo build
      run: cargo xtask ci step check workspace
    - name: Validate excluded directories
      shell: bash
      run: |
        find "$CARGO_HOME/registry/src" -mindepth 3 -maxdepth 3 -type d -name false -print0 |
          while IFS= read -r -d '' cache_dir; do
            if grep -q '"false/' "${cache_dir%/false}/.cargo-checksum.json"; then
              echo "Refusing to exclude packaged source files: $cache_dir" >&2
              exit 1
            fi
            du --bytes --summarize "$cache_dir"
          done > "$RUNNER_TEMP/incremental-cache-sizes.txt"
        awk '{ count++; bytes += $1 } END { print "Excluded directories:", count, "bytes:", bytes }' "$RUNNER_TEMP/incremental-cache-sizes.txt"
        du --bytes --max-depth=2 target "$CARGO_HOME/registry" | sort -nr
    - name: Archive Cargo check artifacts
      id: archive-check
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/cargo-check"
        # Preserve source timestamps and completed build outputs.
        git ls-files -z | tar --null -T - -cf "$RUNNER_TEMP/cargo-check/check-workspace.tar" target
        # The existing rustc flag writes incremental caches into directories named false.
        tar --exclude='registry/src/*/*/false' -cf "$RUNNER_TEMP/cargo-check/check-registry.tar" -C "$CARGO_HOME" registry
        du --bytes "$RUNNER_TEMP/cargo-check/"*
    - name: Upload Cargo check artifacts
      if: steps.archive-check.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: cargo-check
        path: ${{ runner.temp }}/cargo-check/
        compression-level: 1
        retention-days: 1
        if-no-files-found: error
        overwrite: true
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
  baseline-datafusion:
    name: baseline / datafusion
    runs-on: ubuntu-24.04
    container:
      image: amd64/rust@sha256:cc399942461d60f30d20a1e80f1a8f7720bb1590286da6e94626830711570923
