# # CI runners

name: Repack original Cargo artifact
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: amd64/rust@sha256:cc399942461d60f30d20a1e80f1a8f7720bb1590286da6e94626830711570923
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 67ddb91a9fefb1944f7e6e2f2efd595936e34332
    - name: Download existing artifact
      id: download
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        repository: apache/datafusion
        run-id: '34736985556'
        name: cargo-check
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/cargo-check
    - name: Restore existing artifact
      if: steps.download.outcome == 'success'
      run: 'tar -xf "$RUNNER_TEMP/cargo-check/check-workspace.tar"

        tar -xf "$RUNNER_TEMP/cargo-check/check-registry.tar" -C "$CARGO_HOME"'
    - name: Inventory archive contents
      run: 'du --bytes --max-depth=2 target "$CARGO_HOME/registry" | sort -nr

        find target -type f -printf "%s %p\n" | sort -nr | sed -n "1,30p"

        find "$CARGO_HOME/registry" -type f -printf "%s %p\n" | sort -nr | sed -n "1,20p"

        df -h'
    - name: Validate excluded directories
      shell: bash
      run: "find \"$CARGO_HOME/registry/src\" -mindepth 3 -maxdepth 3 -type d -name false -print0 |\n  while IFS= read -r\
        \ -d '' cache_dir; do\n    if grep -q '\"false/' \"${cache_dir%/false}/.cargo-checksum.json\"; then\n      echo \"\
        Refusing to exclude packaged source files: $cache_dir\" >&2\n      exit 1\n    fi\n    du --bytes --summarize \"$cache_dir\"\
        \n  done > \"$RUNNER_TEMP/incremental-cache-sizes.txt\"\nawk '{ count++; bytes += $1 } END { print \"Excluded directories:\"\
        , count, \"bytes:\", bytes }' \"$RUNNER_TEMP/incremental-cache-sizes.txt\"\ndu --bytes --max-depth=2 target \"$CARGO_HOME/registry\"\
        \ | sort -nr\n"
    - name: Repack original registry without incremental caches
      shell: bash
      run: 'tar --anchored --no-wildcards-match-slash --exclude=''registry/src/*/*/false'' -cf "$RUNNER_TEMP/cargo-check/check-registry.tar"
        -C "$CARGO_HOME" registry

        du --bytes "$RUNNER_TEMP/cargo-check/"*

        '
    - name: Upload trimmed original artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: cargo-check-trimmed-original
        path: ${{ runner.temp }}/cargo-check/
        compression-level: 1
        retention-days: 1
